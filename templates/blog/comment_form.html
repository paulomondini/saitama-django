{% extends 'base.html' %}

{% block title %}Comentar em {{ post.title }}{% endblock %}

{% block content %}
  <p class="meta"><a href="{% url 'blog:post-detail' post.pk %}">← voltar para “{{ post.title }}”</a></p>
  <h1>Novo comentário</h1>
  <p class="meta">Comentando em <strong>{{ post.title }}</strong> como <strong>{{ user.username }}</strong>.</p>

  <form class="card stack" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
      <button class="btn primary" type="submit">Publicar comentário</button>
      <a class="btn" href="{% url 'blog:post-detail' post.pk %}">Cancelar</a>
    </div>
  </form>
{% endblock %}
